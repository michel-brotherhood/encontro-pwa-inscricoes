name: Tests

on:
  push:
    branches: [main, 'test/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: event
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event -d event"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_MIGRATION_URL: postgres://event:postgres@localhost:5432/event
      APP_DB_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TEST_DATABASE_MIGRATION_URL: postgres://event:postgres@localhost:5432/event
      TEST_DATABASE_URL: postgres://event_app:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef@localhost:5432/event

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:init
      - run: npm test
